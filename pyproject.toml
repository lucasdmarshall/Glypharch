[project]
name = "tinyocr"
version = "0.1.0"
description = "Millisecond ONNX recognizer for short printed lines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "onnx>=1.16",
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinyocr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
